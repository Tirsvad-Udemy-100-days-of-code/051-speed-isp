[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-isp"
version = "0.1.0"
description = "Day 51 bot: measure internet speed on speedtest.net with Selenium and complain on X (or Y) when it is below the promised speed."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "selenium==4.52.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
]

[project.scripts]
speed-isp = "speed_isp.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "framework", "docs"]

[tool.mypy]
strict = true
files = ["src", "tests"]
